services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-ci-cd-demo:local
    container_name: docker-ci-cd-demo-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
